name: fpga

# The bitstream for the Tiny Tapeout FPGA breakout (iCE40UP5K), built from
# fpga/: a micro tile project has no uio_* and no ena, which the top of
# TinyTapeout/tt-gds-action/fpga/ice40up5k (tt-support-tools' tt_fpga.py)
# instantiates.
on:
  push:
    paths:
      - 'src/**.v'
      - 'fpga/**'
      - '.github/workflows/fpga.yaml'
  workflow_dispatch:

jobs:
  fpga:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: install oss-cad-suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the bitstream
        run: |
          make -C fpga
          grep -E "ICESTORM_LC:|Max frequency" fpga/build/02-nextpnr.log | tee -a $GITHUB_STEP_SUMMARY

      - name: Upload the bitstream
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fpga_bitstream
          path: fpga/build/*
